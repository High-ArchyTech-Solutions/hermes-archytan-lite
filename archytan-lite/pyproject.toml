[project]
name = "hermes-archytan-lite"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # The official Archytan Lite client (MIT): verifies each receipt's
    # Ed25519 signature and that it matches the request, and treats every
    # other outcome as a denial. 2.1.1 is the first with a reused TLS context.
    "archytan-lite>=2.1.1,<3",
]
